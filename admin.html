<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hug刻（はぐこく）｜注文管理ダッシュボード</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background-color: #F7F3EB;
      color: #4A3B32;
    }
    .wood-card {
      background-color: #FFFDF9;
      border: 1.5px solid #E5D9C5;
    }
  </style>
</head>
<body class="min-h-screen pb-16">

  <!-- ダッシュボード本体 -->
  <div id="dashboard">
    <header class="bg-[#EFE7D8] border-b border-[#DFD3BE] py-4 px-4 sticky top-0 z-30">
      <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2.5">
          <img
            src="./ChatGPT_Image_2025年4月24日_23_04_21-removebg-preview.png"
            alt="Hug刻ロゴ"
            class="h-9 w-auto object-contain"
            onerror="this.style.display='none'; document.getElementById('adminFallbackLogo').classList.remove('hidden');"
          />
          <div id="adminFallbackLogo" class="hidden bg-[#F2E2C4] p-1.5 rounded-lg border border-[#DFD3BE] flex items-center justify-center">
            <svg width="26" height="22" viewBox="0 0 120 105" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="44" cy="24" r="16" fill="#8C4A1C"/>
              <circle cx="75" cy="36" r="12.5" fill="#8C4A1C"/>
              <path d="M22 48C17 62 24 80 58 96C90 81 98 63 92 49C88 41 79 41 72 46C66 50 61 52 57 48C51 41 42 36 33 38C27 39 24 43 22 48Z" fill="#8C4A1C"/>
              <path d="M39 58C48 70 67 71 79 62" stroke="#F2E2C4" stroke-width="5.5" stroke-linecap="round"/>
            </svg>
          </div>
          <h1 class="font-bold text-lg text-[#5C3D2E]">Hug刻 注文管理</h1>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="fetchOrders()" class="bg-white border border-[#DFD3BE] text-[#5C3D2E] text-xs font-bold px-3 py-2 rounded-lg hover:bg-[#F7F3EB]">
            🔄 最新情報に更新
          </button>
          <a href="./index.html" target="_blank" class="bg-[#8C583A] text-white text-xs font-bold px-3 py-2 rounded-lg">
            注文フォームを開く ↗
          </a>
        </div>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 mt-6 space-y-6">

      <!-- 集計サマリー -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div class="wood-card rounded-2xl p-4">
          <p class="text-xs text-[#7D6659]">総注文件数</p>
          <p class="text-2xl font-bold text-[#5C3D2E] mt-1"><span id="statTotalCount">0</span><span class="text-xs ml-1">件</span></p>
        </div>
        <div class="wood-card rounded-2xl p-4">
          <p class="text-xs text-[#7D6659]">対応中（未完了）</p>
          <p class="text-2xl font-bold text-[#C86D51] mt-1"><span id="statActiveCount">0</span><span class="text-xs ml-1">件</span></p>
        </div>
        <div class="wood-card rounded-2xl p-4">
          <p class="text-xs text-[#7D6659]">未入金件数</p>
          <p class="text-2xl font-bold text-amber-600 mt-1"><span id="statUnpaidCount">0</span><span class="text-xs ml-1">件</span></p>
        </div>
        <div class="wood-card rounded-2xl p-4">
          <p class="text-xs text-[#7D6659]">累計売上（税込）</p>
          <p class="text-2xl font-bold text-[#5C3D2E] mt-1"><span id="statTotalSales">0</span><span class="text-xs ml-1">円</span></p>
        </div>
      </div>

      <!-- フィルター -->
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="filterOrders('ALL')" class="filter-btn bg-[#8C583A] text-white text-xs font-bold px-3 py-1.5 rounded-full">すべて</button>
        <button onclick="filterOrders('未入金')" class="filter-btn bg-white border border-[#DFD3BE] text-xs font-bold px-3 py-1.5 rounded-full">未入金</button>
        <button onclick="filterOrders('制作中')" class="filter-btn bg-white border border-[#DFD3BE] text-xs font-bold px-3 py-1.5 rounded-full">制作中</button>
        <button onclick="filterOrders('刻印・完成')" class="filter-btn bg-white border border-[#DFD3BE] text-xs font-bold px-3 py-1.5 rounded-full">刻印・完成</button>
        <button onclick="filterOrders('発送・納品済')" class="filter-btn bg-white border border-[#DFD3BE] text-xs font-bold px-3 py-1.5 rounded-full">発送・納品済</button>
        <button onclick="filterOrders('キャンセル')" class="filter-btn bg-white border border-[#DFD3BE] text-xs font-bold px-3 py-1.5 rounded-full">キャンセル</button>
      </div>

      <!-- 注文一覧 -->
      <div id="orderList" class="space-y-4">
        <div class="wood-card rounded-2xl p-8 text-center text-sm text-[#7D6659]">
          データを読み込み中...
        </div>
      </div>

    </main>
  </div>

  <script>
    // ==========================================
    // ★設定：ここにデプロイしたGASのウェブアプリURLを貼る
    // ==========================================
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzoYNABxGXTUfe8IaiSvKwLNopAEOU4lUKQNQdtXOZ-EXKYUZ1jvGrvj4xTuR7xK4ZQ/exec";

    let allOrders = [];
    let currentFilter = "ALL";

    // ページ読み込みと同時に注文一覧を取得
    window.addEventListener('DOMContentLoaded', fetchOrders);

    async function fetchOrders() {
      const listEl = document.getElementById('orderList');
      listEl.innerHTML = '<div class="wood-card rounded-2xl p-8 text-center text-sm text-[#7D6659]">読み込み中...</div>';

      try {
        if (GAS_WEB_APP_URL === "YOUR_GAS_WEB_APP_URL_HERE") {
          // サンプル表示用ダミーデータ
          allOrders = [
            {
              orderId: "HK-20261124-001",
              createdAt: "2026/11/24 11:30",
              status: "制作中",
              lineName: "黒川 遥",
              customerName: "黒川 遥",
              product: "オリジナルキャラクター ＋ オリジナル木製キーホルダー作成",
              options: "裏面メッセージ・文字刻印追加",
              totalPrice: 2400,
              engraveText: "【キャラ要望】バスケユニフォーム姿（背番号96）\n\n【キーホルダー表面】作成したオリジナルキャラクター\n\n【裏面刻印】HARUKA 2026.11.24",
              postalCode: "276-0046",
              address: "千葉県八千代市大和田新田〇〇",
              phone: "080-9707-0250",
              paymentMethod: "PayPay送金",
              notes: "よろしくお願いします！",
              imageUrl: ""
            }
          ];
          updateStats();
          renderOrders();
          return;
        }

        const res = await fetch(GAS_WEB_APP_URL + "?action=getOrders");
        const data = await res.json();
        allOrders = (data.orders || []).reverse(); // 新しい順
        updateStats();
        renderOrders();
      } catch (err) {
        listEl.innerHTML = `<div class="wood-card rounded-2xl p-6 text-center text-sm text-red-600">データ取得エラー: ${err.message}</div>`;
      }
    }

    function updateStats() {
      const validOrders = allOrders.filter(o => o.status !== 'キャンセル');
      document.getElementById('statTotalCount').textContent = validOrders.length;
      const active = validOrders.filter(o => o.status !== '発送・納品済').length;
      const unpaid = validOrders.filter(o => o.status === '未入金').length;
      const sales = validOrders.reduce((sum, o) => sum + Number(o.totalPrice || 0), 0);

      document.getElementById('statActiveCount').textContent = active;
      document.getElementById('statUnpaidCount').textContent = unpaid;
      document.getElementById('statTotalSales').textContent = sales.toLocaleString();
    }

    function filterOrders(status) {
      currentFilter = status;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.textContent === status || (status === 'ALL' && btn.textContent === 'すべて')) {
          btn.className = "filter-btn bg-[#8C583A] text-white text-xs font-bold px-3 py-1.5 rounded-full";
        } else {
          btn.className = "filter-btn bg-white border border-[#DFD3BE] text-xs font-bold px-3 py-1.5 rounded-full";
        }
      });
      renderOrders();
    }

    function renderOrders() {
      const listEl = document.getElementById('orderList');
      const filtered = currentFilter === "ALL"
        ? allOrders
        : allOrders.filter(o => o.status === currentFilter);

      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="wood-card rounded-2xl p-8 text-center text-sm text-[#7D6659]">該当する注文はありません</div>';
        return;
      }

      listEl.innerHTML = filtered.map(order => {
        const badgeColor = {
          "未入金": "bg-amber-100 text-amber-800 border-amber-300",
          "制作中": "bg-blue-100 text-blue-800 border-blue-300",
          "刻印・完成": "bg-purple-100 text-purple-800 border-purple-300",
          "発送・納品済": "bg-green-100 text-green-800 border-green-300",
          "キャンセル": "bg-gray-200 text-gray-600 border-gray-300"
        }[order.status] || "bg-gray-100 text-gray-800";

        const isCanceled = order.status === 'キャンセル';

        // 複数枚の画像URL（改行区切り）を1枚ずつのリンクボタンに変換
        const imageLinks = String(order.imageUrl || "")
          .split(/\r?\n/)
          .map(u => u.trim())
          .filter(Boolean);

        return `
          <div class="wood-card rounded-2xl p-5 space-y-3 shadow-sm ${isCanceled ? 'opacity-65 bg-gray-50' : ''}">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-[#EFE7D8] pb-3">
              <div>
                <span class="text-xs font-bold text-[#8C583A]">${order.orderId}</span>
                <span class="text-xs text-[#7D6659] ml-2">${order.createdAt}</span>
                <h3 class="font-bold text-base mt-0.5 ${isCanceled ? 'line-through text-gray-500' : ''}">
                  LINE名：${order.lineName} <span class="text-xs font-normal text-[#7D6659]">（本名：${order.customerName}）</span>
                </h3>
              </div>
              <div class="flex items-center gap-2">
                <select onchange="updateStatus('${order.orderId}', this.value)" class="text-xs font-bold px-3 py-1.5 rounded-full border ${badgeColor} cursor-pointer focus:outline-none">
                  <option value="未入金" ${order.status === '未入金' ? 'selected' : ''}>未入金</option>
                  <option value="制作中" ${order.status === '制作中' ? 'selected' : ''}>制作中</option>
                  <option value="刻印・完成" ${order.status === '刻印・完成' ? 'selected' : ''}>刻印・完成</option>
                  <option value="発送・納品済" ${order.status === '発送・納品済' ? 'selected' : ''}>発送・納品済</option>
                  <option value="キャンセル" ${order.status === 'キャンセル' ? 'selected' : ''}>キャンセル</option>
                </select>
              </div>
            </div>

            <div class="grid md:grid-cols-2 gap-4 text-xs">
              <div class="space-y-1.5">
                <p><span class="font-bold text-[#8C583A]">商品：</span>${order.product}</p>
                <p><span class="font-bold text-[#8C583A]">オプション：</span>${order.options}</p>
                <p><span class="font-bold text-[#8C583A]">合計金額：</span><span class="font-bold text-sm text-[#C86D51]">${Number(order.totalPrice).toLocaleString()}円</span>（${order.paymentMethod}）</p>
                <div class="bg-[#F7F3EB] p-2.5 rounded-xl mt-1">
                  <p class="font-bold text-[#8C583A] mb-0.5">制作内容・刻印・セリフ：</p>
                  <p class="whitespace-pre-wrap">${order.engraveText || '（記入なし）'}</p>
                </div>
              </div>

              <div class="space-y-1.5">
                <p><span class="font-bold text-[#8C583A]">お届け先：</span>${order.postalCode ? `〒${order.postalCode} ${order.address}` : 'データ納品（郵送なし）'}</p>
                <p><span class="font-bold text-[#8C583A]">電話番号：</span>${order.phone || '-'}</p>
                <p><span class="font-bold text-[#8C583A]">備考：</span>${order.notes || 'なし'}</p>
                ${imageLinks.length > 0 ? `
                  <div class="pt-1 flex flex-wrap gap-1.5">
                    ${imageLinks.map((url, idx) => `
                      <a href="${url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 bg-[#EFE7D8] hover:bg-[#E2D6C1] text-[#5C3D2E] font-bold px-3 py-1.5 rounded-lg">
                        🖼 添付画像${imageLinks.length > 1 ? ` ${idx + 1}` : ''}を開く ↗
                      </a>
                    `).join('')}
                  </div>
                ` : '<p class="text-[#9E8B7E]">※画像添付なし（LINEトークで受取）</p>'}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function updateStatus(orderId, newStatus) {
      try {
        if (GAS_WEB_APP_URL === "YOUR_GAS_WEB_APP_URL_HERE") return;
        await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "updateStatus",
            orderId: orderId,
            status: newStatus
          })
        });
        const target = allOrders.find(o => o.orderId === orderId);
        if (target) target.status = newStatus;
        updateStats();
        renderOrders();
      } catch (err) {
        console.error(err);
      }
    }
  </script>
</body>
</html>
